<section class="contact" id="contact">
  <div class="contact-inner card" gsapReveal="scale">
    <div class="contact-copy">
      <h2>Let’s build something unforgettable.</h2>
      <p>
        Tell me about your product, timeline, and the story you want your users to feel. I’ll respond within
        24 hours.
      </p>
      <div class="contact-info">
        <div>
          <span class="label">Email</span>
          <span>hello&#64;vietstudio.com</span>
        </div>
        <div>
          <span class="label">Location</span>
          <span>Ho Chi Minh City · Remote</span>
        </div>
      </div>
    </div>

    <form class="contact-form" gsapReveal [delay]="0.1">
      <label>
        <span>Name</span>
        <input type="text" placeholder="Your full name" />
      </label>
      <label>
        <span>Project type</span>
        <input type="text" placeholder="Landing, SaaS, E-commerce" />
      </label>
      <label>
        <span>Message</span>
        <textarea rows="4" placeholder="What are you looking to build?"></textarea>
      </label>
      <button type="button" class="primary-btn">Send inquiry</button>
    </form>
  </div>
</section>
